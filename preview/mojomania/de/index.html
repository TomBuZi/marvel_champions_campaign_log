<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Marvel Champions – Kampagnen-Logbuch</title>
    <link rel="canonical" href="../index.html" />
    <!-- A pretty entry point: /de/ opens the app in German.

         GitHub Pages serves static files and cannot rewrite paths, so the
         "path" is a real directory whose index sends the browser on to the one
         and only index.html with ?lang=de. Deliberately NOT a copy of the
         app shell: a second topbar, menu and set of dialogs would drift apart
         within a release.

         The target names index.html explicitly, so this works from file:// too,
         where a directory URL is a listing rather than a page. replace() keeps
         a shared "#log=..." fragment and leaves no extra step in the back
         history; the refresh below is for whatever does not run scripts, such
         as crawlers and link previews. -->
    <script>
      location.replace("../index.html?lang=de" + location.hash);
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=../index.html?lang=de" />
    </noscript>
  </head>
  <body>
    <p><a href="../index.html?lang=de">Marvel Champions – Kampagnen-Logbuch</a></p>
  </body>
</html>
