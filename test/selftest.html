<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" /><title>selftest</title></head>
  <body>
    <pre id="out">running…</pre>
    <script>
      // Temporary harness: drives index.html in an iframe and prints results,
      // so headless --dump-dom can assert on real interactions. Not shipped.
      var lines = [];
      function log(name, ok, extra) {
        lines.push((ok ? "PASS " : "FAIL ") + name + (extra == null ? "" : "  -> " + extra));
      }
      function finish() {
        document.getElementById("out").textContent = lines.join("\n") +
          "\nTOTAL " + lines.length + " FAILURES " +
          lines.filter(function (l) { return l.indexOf("FAIL") === 0; }).length;
      }

      var CASE = new URLSearchParams(location.search).get("case") || "basic";
      var PROGRESS_MAX_T = 3;   // third progress point = failed

      window.addEventListener("error", function (e) {
        lines.push("ERROR " + e.message + " @" + e.filename + ":" + e.lineno);
        finish();
      });
      window.addEventListener("unhandledrejection", function (e) {
        lines.push("REJECT " + (e.reason && e.reason.message ? e.reason.message : e.reason));
        finish();
      });
      // Safety net: print whatever was collected even if a case never calls finish().
      setTimeout(function () {
        if (document.getElementById("out").textContent === "running…") {
          lines.push("TIMEOUT: case never finished");
          finish();
        }
      }, 6000);

      /* Pin the language before booting. Without a stored preference the app
         derives it from navigator.language, so any case asserting German (or
         English) wording would pass or fail with the machine's locale. Only the
         auto-detection itself is allowed to leave this unset. */
      function pinLang(l) {
        localStorage.setItem("mcclog:lang", l);
      }

      function seed(store, active) {
        localStorage.clear();
        localStorage.setItem("mcclog:logs", JSON.stringify(store));
        if (active) localStorage.setItem("mcclog:activeId", active);
        localStorage.setItem("mcclog:lang", "de");
      }

      function boot(hash, then) {
        var f = document.createElement("iframe");
        f.style.cssText = "width:1200px;height:900px";
        f.src = "../index.html" + (hash || "");
        f.onload = function () { setTimeout(function () { then(f, f.contentWindow, f.contentDocument); }, 60); };
        document.body.appendChild(f);
      }

      function fire(node, type) {
        node.dispatchEvent(new f0.Event(type, { bubbles: true }));
      }
      var f0 = window; // replaced with the frame's window before use

      // ---------------------------------------------------------------- basic
      function caseBasic() {
        localStorage.clear();
        pinLang("de");
        boot("", function (frame, w, d) {
          f0 = w;
          /* A first visit asks which campaign rather than picking one, so
             this case has to answer before it has a sheet to test. */
          var dlg0 = d.getElementById("campaign-dialog");
          log("a fresh visit asks which campaign", dlg0.open);
          log("and writes nothing until it is answered",
            Object.keys(JSON.parse(localStorage.getItem("mcclog:logs") || "{}")).length === 0,
            localStorage.getItem("mcclog:logs"));
          /* Nothing to go back to, so no way out — cancelling would leave an
             empty page. */
          log("the way out is removed on a first visit",
            d.getElementById("btn-campaign-cancel").hidden);
          pick(d, "fear-no-evil");
          fire(d.getElementById("campaign-form"), "submit");

          var store = JSON.parse(localStorage.getItem("mcclog:logs") || "{}");
          var ids = Object.keys(store);
          log("answering it creates one log", ids.length === 1, ids.length);
          var log0 = store[ids[0]];
          log("log carries campaignId", log0 && log0.campaignId === "fear-no-evil", log0 && log0.campaignId);
          log("log title auto-named", log0 && log0.title === "Fear No Evil", log0 && log0.title);
          log("state has 5 scenarios", log0 && log0.state.scenarios.length === 5);

          /* Standard level is the default, and it has no hit-point field. The
             rest of this case is about that field, so switch to expert first —
             the hint lives inside it. */
          log("a fresh sheet starts at standard level",
            log0 && log0.state.expert === false, log0 && log0.state.expert);
          log("standard level shows no hit points",
            !d.querySelector(".player-card .num-input"));
          var expertBox = d.querySelector("[data-section=players] .panel-head .flag .sheet-check");
          expertBox.checked = true;
          fire(expertBox, "change");
          log("expert level reveals the hit points",
            !!d.querySelector(".player-card .num-input"));

          // Type a hero, check the starting-hit-points hint appears.
          var hero = d.querySelectorAll(".player-card .text-input")[0];
          hero.value = "She-Hulk";
          fire(hero, "input");
          var hint = d.querySelectorAll(".player-card .num-hint")[0];
          log("hero hint shows printed HP", hint.textContent.trim() === "/ 15", JSON.stringify(hint.textContent));

          // Duplicate hero marking. A fresh sheet has one player, so the
          // second card has to be added before there can be a clash.
          d.querySelector('[data-section="players"] .btn-add').click();
          log("a second player can be added",
            d.querySelectorAll(".player-card").length === 2,
            d.querySelectorAll(".player-card").length);
          var hero2 = d.querySelectorAll(".player-card .text-input")[1];
          hero2.value = "she-hulk";
          fire(hero2, "input");
          log("duplicate hero flagged",
            d.querySelectorAll(".player-card.is-duplicate").length === 2,
            d.querySelectorAll(".player-card.is-duplicate").length);
          hero2.value = "";
          fire(hero2, "input");
          log("duplicate mark clears",
            d.querySelectorAll(".player-card.is-duplicate").length === 0);

          // HP clamp: empty stays null, over-max clamps.
          var hp = d.querySelectorAll(".player-card .num-input")[0];
          hp.value = "120";
          fire(hp, "input");
          fire(hp, "blur");
          log("HP clamps to 99", hp.value === "99", hp.value);
          hp.value = "";
          fire(hp, "input");
          fire(hp, "blur");

          // Villain mutual exclusion.
          var sel = d.querySelectorAll(".pool-select");
          sel[0].value = "bullseye";
          fire(sel[0], "change");
          var disabledElsewhere = 0;
          for (var i = 1; i < sel.length; i++) {
            if (sel[i].querySelector('option[value="bullseye"]').disabled) disabledElsewhere++;
          }
          log("chosen villain disabled in other rows", disabledElsewhere === 4, disabledElsewhere);
          log("own value stays enabled",
            !sel[0].querySelector('option[value="bullseye"]').disabled);
          var usedChip = d.querySelector('.chip[data-villain="bullseye"]');
          log("villain chip marked used", usedChip.classList.contains("chip--used"));
          log("chip names the scenario",
            /Kunstmuseum/.test(usedChip.title || ""), usedChip.title);
          sel[0].value = "";
          fire(sel[0], "change");
          log("clearing frees the villain again",
            !sel[1].querySelector('option[value="bullseye"]').disabled &&
            !d.querySelector('.chip[data-villain="bullseye"]').classList.contains("chip--used"));

          // Progress counter: click up, then click the top box to step back.
          function boxes(row) { return d.querySelectorAll("tbody tr")[row].querySelectorAll(".progress-box"); }
          boxes(0)[0].click();
          log("progress 1 fills one box",
            d.querySelectorAll("tbody tr")[0].querySelectorAll(".progress-box.filled").length === 1);
          boxes(0)[2].click();
          log("progress 3 marks the row failed",
            d.querySelectorAll("tbody tr")[0].classList.contains("is-failed"));
          boxes(0)[2].click();
          log("clicking the top box steps back to 2",
            d.querySelectorAll("tbody tr")[0].querySelectorAll(".progress-box.filled").length === 2 &&
            !d.querySelectorAll("tbody tr")[0].classList.contains("is-failed"));
          boxes(0)[1].click();
          boxes(0)[0].click();
          log("stepping down reaches 0",
            d.querySelectorAll("tbody tr")[0].querySelectorAll(".progress-box.filled").length === 0);

          // String list: add is blocked while an empty row is open.
          var add = d.querySelector(".entry-add");
          add.click();
          log("add disabled while an empty row is open", add.disabled);
          var entry = d.querySelector(".entry-input");
          entry.value = "~Mockingbird";
          fire(entry, "input");
          fire(entry, "blur");
          log("tilde strikes the entry through", entry.classList.contains("struck"));
          log("tilde is hidden while unfocused", entry.value === "Mockingbird", entry.value);
          fire(entry, "focus");
          log("focus restores the raw text", entry.value === "~Mockingbird", entry.value);
          fire(entry, "blur");
          log("add enabled again once filled", !d.querySelector(".entry-add").disabled);

          // Flags.
          /* Scoped to the campaign-state panel: the expert switch in the
             player panel head is a .flag too, and it comes first in the
             document. */
          var flagBoxes = d.querySelectorAll("[data-section=flags] .flag .sheet-check");
          flagBoxes[1].checked = true;
          fire(flagBoxes[1], "change");

          // Persistence: flush and read back what is in storage.
          w.dispatchEvent(new w.Event("pagehide"));
          setTimeout(function () {
            var saved = JSON.parse(localStorage.getItem("mcclog:logs"))[ids[0]];
            log("hero persisted", saved.state.players[0].hero === "She-Hulk", saved.state.players[0].hero);
            log("empty HP persisted as null", saved.state.players[0].hp === null, JSON.stringify(saved.state.players[0].hp));
            log("removed list persisted",
              JSON.stringify(saved.state.removed) === JSON.stringify(["~Mockingbird"]),
              JSON.stringify(saved.state.removed));
            log("flag persisted", saved.state.flags.maryDefeated === true);
            log("updatedAt moved on", saved.updatedAt > saved.createdAt || saved.updatedAt === saved.createdAt);
            finish();
          }, 500);
        });
      }

      // ------------------------------------------------------- quarantine set
      function caseQuarantine() {
        var mk = function (over) {
          var base = {
            schemaVersion: 1, id: over.id, campaignId: "fear-no-evil", stateVersion: 1,
            title: over.title, createdAt: "2026-01-01T00:00:00.000Z",
            updatedAt: "2026-01-02T00:00:00.000Z",
            state: { players: [], scenarios: [], removed: ["keep me"], flags: {} },
            extraFieldFromTheFuture: "must survive",
          };
          Object.keys(over).forEach(function (k) { base[k] = over[k]; });
          return base;
        };
        var future = mk({ id: "aaa", title: "Future schema", schemaVersion: 99 });
        /* A campaign that will never exist — "no-such-campaign", the same id as
           in caseImport. This has now been broken TWICE by a real campaign
           shipping under the id the fixture had borrowed (MC24 first, then
           MC32 as "mutant-genesis"), each time silently turning three
           quarantine assertions into assertions about nothing. So the id is
           deliberately not a campaign name at all, and test/lint.js now checks
           that no registered campaign has claimed it. */
        var unknown = mk({ id: "bbb", title: "Unknown campaign", campaignId: "no-such-campaign" });
        var newerSheet = mk({ id: "ccc", title: "Newer sheet", stateVersion: 42 });
        var before = { aaa: JSON.stringify(future), bbb: JSON.stringify(unknown), ccc: JSON.stringify(newerSheet) };
        seed({ aaa: future, bbb: unknown, ccc: newerSheet }, "aaa");

        boot("", function (frame, w, d) {
          f0 = w;
          var notice = d.getElementById("notice");
          log("future schema shows a notice", !notice.hidden && /neueren Version/.test(notice.textContent),
            notice.textContent.slice(0, 60));
          log("sheet hidden while quarantined", d.getElementById("campaign").hidden);
          log("rename blocked", d.getElementById("btn-rename").disabled);
          log("delete still available", !d.getElementById("btn-delete").disabled);
          log("picker marks quarantined logs",
            (d.getElementById("log-select").textContent.match(/⚠/g) || []).length === 3);
          log("unknown campaign gets its own optgroup",
            /no-such-campaign/.test(d.getElementById("log-select").innerHTML));

          var sel = d.getElementById("log-select");
          sel.value = "bbb";
          fire(sel, "change");
          log("unknown-campaign notice names the campaign",
            /no-such-campaign/.test(d.getElementById("notice").textContent),
            d.getElementById("notice").textContent.slice(0, 70));
          sel.value = "ccc";
          fire(sel, "change");
          log("newer-sheet notice names the campaign",
            /Fear No Evil/.test(d.getElementById("notice").textContent),
            d.getElementById("notice").textContent.slice(0, 70));

          var after = JSON.parse(localStorage.getItem("mcclog:logs"));
          ["aaa", "bbb", "ccc"].forEach(function (id) {
            log("blob " + id + " left byte-identical",
              JSON.stringify(after[id]) === before[id]);
          });
          finish();
        });
      }

      // ------------------------------------------------------------ sharelink
      function caseShare() {
        // Build a share payload the way core.js does, then load it.
        var payloadLog = {
          schemaVersion: 1, id: "shared-1", campaignId: "fear-no-evil", stateVersion: 1,
          title: "Von unterwegs", createdAt: "2026-02-01T00:00:00.000Z",
          updatedAt: "2026-02-02T00:00:00.000Z",
          state: {
            players: [{ hero: "Daredevil", hp: 7 }],
            scenarios: [{ slug: "the-getaway", completed: true, villain: "purple-man", progress: 2 }],
            removed: ["Jessica Jones"],
            flags: { trustEstablished: true, maryDefeated: false },
          },
        };
        var bytes = new TextEncoder().encode(JSON.stringify(payloadLog));
        var cs = new CompressionStream("deflate-raw");
        new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer().then(function (buf) {
          var u8 = new Uint8Array(buf), bin = "";
          for (var i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
          var payload = "d" + btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
          localStorage.clear();
          // The import asks for confirmation; auto-accept it inside the frame.
          var f = document.createElement("iframe");
          f.style.cssText = "width:1200px;height:900px";
          f.src = "../index.html#log=" + payload;
          f.onload = function () { setTimeout(check, 200); };
          document.body.appendChild(f);
          // confirm() must be stubbed before the frame's script runs, which is
          // why the srcdoc-free path above is paired with this early hook.
          var iv = setInterval(function () {
            try { if (f.contentWindow) { f.contentWindow.confirm = function () { return true; }; } } catch (e) {}
          }, 1);
          function check() {
            clearInterval(iv);
            var w = f.contentWindow, d = f.contentDocument;
            f0 = w;
            var store = JSON.parse(localStorage.getItem("mcclog:logs") || "{}");
            var got = store["shared-1"];
            log("share link imported the log", !!got, Object.keys(store).join(","));
            if (got) {
              log("title came through", got.title === "Von unterwegs", got.title);
              log("hero came through", got.state.players[0].hero === "Daredevil");
              log("hp came through", got.state.players[0].hp === 7);
              log("partial scenario list filled to 5", got.state.scenarios.length === 5);
              var g = got.state.scenarios.filter(function (s) { return s.slug === "the-getaway"; })[0];
              log("scenario data landed on the right row",
                g && g.completed === true && g.villain === "purple-man" && g.progress === 2,
                JSON.stringify(g));
              log("flag came through", got.state.flags.trustEstablished === true);
            }
            log("hash removed from the address", w.location.hash === "", w.location.hash);
            finish();
          }
        });
      }

      // ------------------------------------------------------------- language
      function caseLang() {
        localStorage.clear();
        pinLang("de");
        boot("", function (frame, w, d) {
          f0 = w;
          answerCampaignDialog(d, "fear-no-evil");
          log("stored preference wins", d.documentElement.lang === "de", d.documentElement.lang);
          log("German section heading",
            /Spieler-Informationen/.test(d.getElementById("campaign").textContent));
          d.getElementById("btn-lang").click();
          log("switches to English", d.documentElement.lang === "en", d.documentElement.lang);
          log("English section heading",
            /Player Information/.test(d.getElementById("campaign").textContent));
          log("English scenario names",
            /Art Museum Heist/.test(d.getElementById("campaign").textContent));
          log("English scenario row tagged lang=en",
            d.querySelector(".scenario-name").getAttribute("lang") === "en");
          log("villain names stay English",
            /Typhoid Mary/.test(d.getElementById("campaign").textContent));
          log("no empty labels left",
            Array.prototype.every.call(d.querySelectorAll("[data-i18n]"),
              function (n) { return n.textContent.trim().length > 0; }));
          d.getElementById("btn-lang").click();
          log("switches back to German", d.documentElement.lang === "de");

          // Theme toggle survives a reload.
          d.getElementById("btn-theme").click();
          var t1 = d.documentElement.getAttribute("data-theme");
          log("theme attribute set", t1 === "dark" || t1 === "light", t1);
          log("theme persisted", localStorage.getItem("mcclog:theme") === t1);
          log("campaign skin hook set",
            d.documentElement.getAttribute("data-campaign") === "fne");

          /* "?lang=" in the address — what the /de/ and /en/ entry points
             redirect to. It has to beat a stored preference, otherwise the link
             does nothing on the one device that has used the app before, and it
             has to be remembered so the next visit without it stays put. */
          var logs = localStorage.getItem("mcclog:logs");
          localStorage.clear();
          localStorage.setItem("mcclog:logs", logs);
          pinLang("de");
          boot("?lang=en", function (frameQ, wQ, dQ) {
            log("?lang= beats the stored preference",
              dQ.documentElement.lang === "en", dQ.documentElement.lang);
            log("?lang= is taken over as the choice",
              localStorage.getItem("mcclog:lang") === "en",
              localStorage.getItem("mcclog:lang"));
            log("English heading from the link alone",
              /Player Information/.test(dQ.getElementById("campaign").textContent));

            /* A language this app does not have must not silently mean German:
               the stored preference stays in charge. */
            pinLang("de");
            boot("?lang=fr", function (frameX, wX, dX) {
              log("unknown ?lang= ignored",
                dX.documentElement.lang === "de", dX.documentElement.lang);
              log("unknown ?lang= leaves the stored choice alone",
                localStorage.getItem("mcclog:lang") === "de",
                localStorage.getItem("mcclog:lang"));

              /* With no stored preference the language follows the browser.
                 Derive the expectation from navigator.language instead of
                 hardcoding one, so this passes on a German and an English
                 machine alike — the assumption that broke this suite in CI. */
              localStorage.clear();
              localStorage.setItem("mcclog:logs", logs);
              boot("", function (frame2, w2, d2) {
                var expected = (w2.navigator.language || "de").toLowerCase().indexOf("en") === 0
                  ? "en" : "de";
                log("auto-detected language follows the browser",
                  d2.documentElement.lang === expected,
                  "navigator.language=" + w2.navigator.language +
                  " expected=" + expected + " got=" + d2.documentElement.lang);
                log("auto-detected language is one of de/en",
                  ["de", "en"].indexOf(d2.documentElement.lang) !== -1);
                finish();
              });
            });
          });
        });
      }

      // -------------------------------------------------------- language paths
      /* Like boot(), but through the redirecting /de/ and /en/ entry points: the
         frame navigates a second time, so one "load" event proves nothing — poll
         until the app itself is in there. */
      function bootVia(src, then) {
        var f = document.createElement("iframe");
        f.style.cssText = "width:1200px;height:900px";
        f.src = src;
        var waited = 0;
        function poll() {
          var d = f.contentDocument;
          /* Ready means either a rendered sheet or the question being asked: a
             first visit shows the campaign dialog and leaves the sheet empty,
             so waiting only for content would wait forever. */
          var dlg = d && d.getElementById("campaign-dialog");
          if (dlg && dlg.open) {
            then(f, f.contentWindow, d);
            return;
          }
          var panel = d && d.getElementById("campaign");
          if (panel && panel.textContent.trim().length > 0) {
            then(f, f.contentWindow, d);
            return;
          }
          waited += 60;
          if (waited > 2000) {
            log(src + " reaches the app", false, "still waiting after " + waited + " ms");
            finish();
            return;
          }
          setTimeout(poll, 60);
        }
        document.body.appendChild(f);
        setTimeout(poll, 60);
      }

      function caseLangPath() {

        pinLang("de");
        bootVia("../en/index.html", function (frame, w, d) {

          answerCampaignDialog(d, "fear-no-evil");
          log("/en/ lands on the app",
            /\/index\.html$/.test(w.location.pathname), w.location.pathname);
          log("/en/ arrives with ?lang=en", w.location.search === "?lang=en", w.location.search);
          log("/en/ shows English despite a stored German",
            d.documentElement.lang === "en", d.documentElement.lang);
          log("/en/ renders the English sheet",
            /Player Information/.test(d.getElementById("campaign").textContent));

          bootVia("../de/index.html", function (frame2, w2, d2) {
            log("/de/ arrives with ?lang=de", w2.location.search === "?lang=de", w2.location.search);
            log("/de/ shows German despite the English just stored",
              d2.documentElement.lang === "de", d2.documentElement.lang);
            log("/de/ renders the German sheet",
              /Spieler-Informationen/.test(d2.getElementById("campaign").textContent));
            finish();
          });
        });
      }

          w.dispatchEvent(new w.Event("beforeprint"));

          log("print view built", pv.children.length > 0, pv.children.length);
          log("print names the campaign", /Fear No Evil \(MC60\)/.test(text));
          log("print says which level was played",
            /\[ \] Expertenmodus/.test(text), text.slice(0, 130));
          /* Standard level, so the hit points are not on the sheet and must

          log("print omits the hit points at standard level",

          log("print carries the hero", /Daredevil/.test(text));
          log("print marks the villain", /Typhoid Mary/.test(text));
          log("print shows the failed scenario", /Gescheitert/.test(text));
          log("print keeps the struck entry", /Foggy Nelson/.test(text));

          log("print hides the tilde", text.indexOf("~") === -1);
          log("print ticks the set flag", /\[x\] Vertrauen hergestellt/.test(text));
          log("print keeps the disclaimer", /MARVEL/.test(text));
          finish();
        });
      }

      // ----------------------------------------------------------- file import
      function caseImport() {
        localStorage.clear();
        var f = document.createElement("iframe");
        f.style.cssText = "width:1200px;height:900px";
        f.src = "../index.html";
        var answer = true;
        var iv = setInterval(function () {
          try { if (f.contentWindow) { f.contentWindow.confirm = function () { return answer; }; } } catch (e) {}
        }, 1);
        f.onload = function () { setTimeout(start, 120); };
        document.body.appendChild(f);

        /* FileReader is asynchronous, so wait for the store instead of guessing
           a delay — a fixed sleep made assertions read the state from before
           the import.

           `ready(store)` has to name what THIS drop is waiting for. Waiting for
           "the store changed at all" is not enough: saving is debounced by
           350ms, so a write left over from the previous step can land inside
           the window, and the callback then runs before the file has even been
           parsed. That made CI fail intermittently on a later assertion, which
           is a miserable place to learn about it. */
        function drop(obj, ready, then) {
          var w = f.contentWindow, d = f.contentDocument;
          var file = new w.File([JSON.stringify(obj, null, 2)], "log.json", { type: "application/json" });
          var dt = new w.DataTransfer();
          dt.items.add(file);
          var input = d.getElementById("file-import");
          input.files = dt.files;
          input.dispatchEvent(new w.Event("change", { bubbles: true }));
          var waited = 0;
          (function poll() {

      // ------------------------------------------------------------------ lock
      // "Completed" and "Failed" are mutually exclusive and lock each other.
      function caseLock() {
        localStorage.clear();
        pinLang("de");
        boot("", function (frame, w, d) {
          f0 = w;
          answerCampaignDialog(d, "fear-no-evil");
          function rows() { return d.querySelectorAll("tbody tr"); }
          function done(i) { return rows()[i].querySelector(".sheet-check"); }
          function boxes(i) { return rows()[i].querySelectorAll(".progress-box"); }
          function boxState(i) {
            return Array.prototype.map.call(boxes(i), function (b) {
              return (b.classList.contains("filled") ? "1" : "0") + (b.disabled ? "L" : "-");
            }).join(" ");
          }

          // Nothing is locked on a fresh row.
          log("fresh row: progress operable", !boxes(0)[0].disabled);
          log("fresh row: completed operable", !done(0).disabled);

          // Ticking Completed freezes the progress boxes but keeps the marks.
          boxes(0)[1].click();                       // progress 2
          log("progress set to 2 before locking", boxState(0) === "1- 1- 0-", boxState(0));
          done(0).checked = true;
          fire(done(0), "change");
          log("completed freezes every progress box",
            Array.prototype.every.call(boxes(0), function (b) { return b.disabled; }),
            boxState(0));
          log("frozen marks are kept",
            boxes(0)[0].classList.contains("filled") &&
            boxes(0)[1].classList.contains("filled") &&
            !boxes(0)[2].classList.contains("filled"), boxState(0));
          log("frozen boxes leave the tab order",
            rows()[0].querySelectorAll(".progress-box:disabled").length === 3);
          log("lock reason offered on hover",
            /abgeschlossen/i.test(boxes(0)[0].title || ""), boxes(0)[0].title);
          log("completed itself stays operable", !done(0).disabled);

          // A click on a frozen box changes nothing.
          boxes(0)[2].click();
          log("clicking a frozen box does nothing", boxState(0) === "1L 1L 0L", boxState(0));

          // Unticking Completed hands the counter back, unchanged.
          done(0).checked = false;
          fire(done(0), "change");
          log("unticking completed unfreezes the counter", boxState(0) === "1- 1- 0-", boxState(0));

          // The other direction: the third progress point locks Completed.
          boxes(1)[2].click();                       // progress 3 -> failed
          log("third point marks the row failed", rows()[1].classList.contains("is-failed"));
          log("failed locks the completed box", done(1).disabled);
          log("failed row keeps its progress operable", !boxes(1)[2].disabled);
          log("lock reason names the failure",
            /gescheitert/i.test(done(1).title || ""), done(1).title);
          done(1).click();
          log("clicking a locked completed box does nothing", !done(1).checked);
          boxes(1)[2].click();                       // back to 2
          log("taking a point back unlocks completed", !done(1).disabled);

          // Neither state can be reached from the other, so both are never set
          // at once through the UI.
          done(2).checked = true;
          fire(done(2), "change");
          boxes(2)[2].click();                       // locked, so this is a no-op
          log("row 3 is completed in the DOM", done(2).checked);
          log("row 3 did not also become failed",
            !rows()[2].classList.contains("is-failed") &&
            !boxes(2)[2].classList.contains("filled"), boxState(2));
          /* Saving is debounced, so read the store only after a flush —
             otherwise this assertion passes on the state from before the
             change, which is no assertion at all. */
          w.dispatchEvent(new w.Event("pagehide"));
          setTimeout(function () {
            var s2 = JSON.parse(localStorage.getItem("mcclog:logs"));
            var stored = s2[Object.keys(s2)[0]].state.scenarios[2];
            log("the change reached storage", stored.completed === true, JSON.stringify(stored));
            log("UI cannot produce completed AND failed",
              !(stored.completed && stored.progress >= PROGRESS_MAX_T), JSON.stringify(stored));
            finish();
          }, 500);
        });
      }

      /* WCAG relative luminance and contrast ratio, so "is this readable" can
         be asserted as a number instead of eyeballed in a screenshot. */
      function luminance(rgb) {
        var c = rgb.map(function (v) {
          v = v / 255;
          return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
        });
        return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
      }
      function parseRgb(str) {
        var m = String(str).match(/\d+(?:\.\d+)?/g);
        return m ? m.slice(0, 3).map(Number) : [0, 0, 0];
      }
      function contrast(fg, bg) {
        var a = luminance(parseRgb(fg)), b = luminance(parseRgb(bg));
        var hi = Math.max(a, b), lo = Math.min(a, b);
        return (hi + 0.05) / (lo + 0.05);
      }

          log("the button is offered on a fresh sheet", !!btn() && !btn().disabled);

      // ------------------------------------------------------ round: the draw
      /* The pair has to be drawn, not taken from the top of the sheet. */
      function caseRoundSpread() {
        localStorage.clear();
        pinLang("de");
        boot("", function (frame, w, d) {
          f0 = w;
          answerCampaignDialog(d, "fear-no-evil");
          var pairs = {}, rounds = 20;

          /* Every click re-renders the panel, so a node grabbed before the
             click is detached afterwards and its state never changes again —
             reading it in a loop condition spins forever. Re-query after each
             single click, and cap the whole thing rather than trusting it. */
          function resetAll() {
            for (var guard = 0; guard < 40; guard++) {
              var rs = d.querySelectorAll("tbody tr");
              var clicked = false;
              for (var i = 0; i < rs.length; i++) {
                var n = rs[i].querySelectorAll(".progress-box.filled").length;
                if (n) {
                  rs[i].querySelectorAll(".progress-box")[n - 1].click();
                  clicked = true;
                  break;
                }
              }
              if (!clicked) return true;
            }
            return false;
          }
          for (var n = 0; n < rounds; n++) {
            var btn = d.querySelector('[data-section="scenarios"] .btn-add');
            btn.click();
            var hit = [];
            Array.prototype.forEach.call(d.querySelectorAll("tbody tr"), function (r, i) {
              if (r.querySelectorAll(".progress-box.filled").length) hit.push(i);
            });
            pairs[hit.join("+")] = (pairs[hit.join("+")] || 0) + 1;
            if (!resetAll()) { log("reset ran away", false); return finish(); }
          }
          var distinct = Object.keys(pairs);
          log("the pair is drawn, not taken from the top", distinct.length > 1,
            rounds + " rounds -> " + JSON.stringify(pairs));
          log("more than two scenarios were reached over time",
            new Set(distinct.join("+").split("+")).size > 2, JSON.stringify(pairs));
          log("every draw hit exactly two rows",
            distinct.every(function (k) { return k.split("+").length === 2; }),
            JSON.stringify(pairs));
          finish();

      /* A bare MC10 log with one empty player — the shape emptyState() makes. */
      function rrsLog() {
        return {
          schemaVersion: 1, id: "rrs1", campaignId: "rise-of-red-skull", stateVersion: 1,
          title: "The Rise of Red Skull",
          createdAt: "2026-01-01T00:00:00.000Z", updatedAt: "2026-01-02T00:00:00.000Z",
          state: {
            /* Expert, because two of the fields these cases drive exist only
               there. caseRrsExpert is the one that starts at standard. */
            expert: true,
            players: [rrsPlayer("", null)],
            experimentalWeapons: [], delayCounters: null, removed: [],
          },
        };
      }
      function rrsPlayer(hero, hp) {
        return { hero: hero, hp: hp, obligations: [], techUpgrade: "",
                 basicUpgrade: "", rescuedAllies: [], engagedWithMinion: false };
      }

      /* Choose a campaign in the new-log dialog by id. By value rather than by
         position, because the order of the choices is a feature of its own now
         and an index would break the next time a campaign lands. */
      function pick(d, campaignId) {
        var boxes = d.getElementById("campaign-choices")
          .querySelectorAll("input[type=radio]");
        for (var i = 0; i < boxes.length; i++) {
          if (boxes[i].value === campaignId) {
            boxes[i].checked = true;
            fire(boxes[i], "change");
            return boxes[i];
          }
        }
        return null;
      }

      /* A first visit asks which campaign instead of creating a sheet, so a case
         that wants one has to answer. Idempotent: does nothing when the dialog
         is not open, e.g. because the case seeded a log or followed a share
         link. Cases about the dialog itself answer it by hand. */
      function answerCampaignDialog(d, campaignId) {
        var dlg = d.getElementById("campaign-dialog");
        if (!dlg || !dlg.open) return false;
        pick(d, campaignId);
        fire(d.getElementById("campaign-form"), "submit");
        return true;
      }

      /* Tick a checkbox the way a click would: the widget listens for change. */
      function tick(box) {
        box.checked = true;
        fire(box, "change");
      }

      /* Add one entry to the list with this id: press its own add button, then
         fill the row that appeared. */
      function addEntry(d, listId, value) {
        var list = d.querySelector("[data-list-id=" + JSON.stringify(listId) + "]");
        list.parentNode.querySelector(".entry-add").click();
        var inputs = list.querySelectorAll(".entry-input");
        var input = inputs[inputs.length - 1];
        input.value = value;
        fire(input, "input");
        fire(input, "blur");
      }

      /* MC27 has no printed checkbox on it at all, so where the sheet's blank
         lines mean cards, the module supplies the set — as boxes where the

         one rung at a time. These cases are about the sets being the right
         sets, the cells keeping their positions, and the one number governing
         what is open without ever emptying anything. */
      function smLog() {
        return {
          schemaVersion: 1, id: "sm1", campaignId: "sinister-motives", stateVersion: 1,
          title: "Sinister Motives",
          createdAt: "2026-01-01T00:00:00.000Z", updatedAt: "2026-01-02T00:00:00.000Z",
          state: {
            /* Expert, because the hit points only exist there. caseSmExpert is
               the one that starts at standard. */
            expert: true,
            /* At the top of the track, so every gated field is open and this
               case can actually type into them. caseSmRep is the one that
               starts partway up and checks what is closed. */
            reputation: 25,
            players: [{ hero: "", hp: null, shieldTech: "",
                        aspectAdvantage: "", planningAhead: "" }],
            /* Deliberately absent: normalize() has to build every set and every
               cell out of a state that mentions none of them. */

        };

      /* The sections the printed sheet has, by their stable data-section keys —
         not by their labels, which are still to be translated. The three
         reward sections are not among them: their P1..P4 column is just the
         player list again, so their fields sit in the player cards. */
      var SM_SECTIONS = ["players", "reputation", "community-service",
        "waking-nightmare", "last-ones-standing", "final-score", "osborn-tech"];

        seed({ sm1: smLog() }, "sm1");

          log("every printed section has a panel",
            found.length === SM_SECTIONS.length, found.join());
          log("and no panel beyond them",
            at("[data-section]").length === SM_SECTIONS.length,
            at("[data-section]").length);

          /* Which cards, so boxes over the whole set: five side schemes and the

      /* The reputation is the one piece of state the log page does not print —

         it, both are repainted in place, and neither may ever empty a field. */
      function caseSmRep() {
        var seeded = smLog();
        seeded.state.reputation = 11;
        /* Filled in above the current marker on purpose: Planning Ahead opens
           at 17, so this entry is in a closed field — exactly the state that
           would lose data if closing were clearing. */

          };

          log("the track has one editable number and nothing else",
            panel.querySelectorAll("input, select, textarea").length === 1,
            panel.querySelectorAll("input, select, textarea").length);
          log("the field carries the seeded value", field.value === "11", field.value);
          /* Measured off the sheet: the seven rules that cross the track run
             through the centres of exactly these circles. */
          log("seven rungs at 1, 5, 9, 13, 17, 21, 25",
            at() === "1,5,9,13,17,21,25", at());
          log("at 11 the first three are in force", reached() === "1,5,9", reached());

          /* The legend from the foot of the track page: six ways to score. */

          log("at 11 exactly the rungs up to 11 are open", open() === "1,9,1", open());

          log("but its entry is still there, not cleared",
            closed.querySelector(".text-input").value === "Swinging Web Kick",

          log("and an open field carries no note",
            app.querySelector('[data-unlock="9"] .lock-note').textContent === "");
          /* The die is gated with its field, and says the same reason: the last

          var lateDie = app.querySelector('[data-unlock="21"] .icon-btn');

          log("and the die of the last cell with it", !lateDie.disabled);

          log("an empty track has nothing in force", reached() === "", reached());
          log("and closes every gated field again", open() === "", open());
          log("without emptying any of them",
            app.querySelector('[data-unlock="1"] .pool-select').value === "laser-goggles",
            app.querySelector('[data-unlock="1"] .pool-select').value);

          field.value = "17";

         asks WHICH cards, and as a grid where the same five cards recur once per
         scenario. On top of that, which five upgrade boxes a player sees follows
         the role they picked. These cases are about the sets being the right
         sets, the grid keeping its columns, the role deciding labels without
         ever deciding what is stored, and exactly one pair of boxes locking. */
      function mgLog() {
        return {
          schemaVersion: 1, id: "mg1", campaignId: "mutant-genesis", stateVersion: 1,
          title: "Mutant Genesis",
          createdAt: "2026-01-01T00:00:00.000Z", updatedAt: "2026-01-02T00:00:00.000Z",
          state: {
            /* Expert, because the hit points only exist there. caseMgExpert is
               the one that starts at standard. */
            expert: true,
            players: [{ hero: "", hp: null, role: "", upgrades: [] }],
            /* Everything else deliberately absent: normalize() has to build both
               sets, the four-column grid and the five Jubilee boxes out of a
               state that mentions none of them. */
          },
        };
      }

      /* The sections the printed sheet has, by their stable data-section keys —
         not by their labels, which are still to be translated. "Role Upgrades in
         Play" is not among them: its Player #1..#4 column is just the player
         list again, so its boxes sit in the player cards. */
      var MG_SECTIONS = ["players", "side-schemes", "future-past-victory",
        "future-past-deck", "jubilee", "abduction-protocols", "removed-allies"];

          /* The one that must NOT be a panel: the sheet's Player #1..#4 column
             is the player list again, so the boxes belong in the cards. */
          log("the role upgrades are not a panel of their own",
            !app.querySelector('[data-section="role-upgrades"]'));
          log("they sit in the player card instead",
            !!app.querySelector(".player-card [data-upgrades]"));

          /* Which cards, so boxes over the whole set — and the side schemes keep
             one scenario column each, because the sheet prints a SCENARIO pill
             over every one of those boxes. */
          log("the four side schemes keep their four scenario columns",
            at('[data-section="side-schemes"] .cell').length === 4 &&
            at('[data-section="side-schemes"] .sheet-check').length === 4,
            at('[data-section="side-schemes"] .cell').length);
          log("the victory display is the whole Future Past set",
            at('[data-section="future-past-victory"] .sheet-check').length === 5,
            at('[data-section="future-past-victory"] .sheet-check').length);
          log("the captive allies are four boxes",
            at('[data-section="abduction-protocols"] .sheet-check').length === 4,
            at('[data-section="abduction-protocols"] .sheet-check').length);

          /* The encounter deck is the one grid: the same five cards once per

          log("the deck grid is five cards by four scenarios",
            at('[data-section="future-past-deck"] .sheet-check').length === 20,
            at('[data-section="future-past-deck"] .sheet-check').length);
          log("with a row header per card and a column header per scenario",
            at('[data-section="future-past-deck"] th[scope="row"]').length === 5 &&
            at('[data-section="future-past-deck"] th[scope="col"]').length === 5,
            at('[data-section="future-past-deck"] th[scope="row"]').length + "/" +
            at('[data-section="future-past-deck"] th[scope="col"]').length);

          /* Named, and named out of two DIFFERENT sets. The card names are still
             to be translated, so what is checked is the relationship between the
             panels rather than the words in them — wiring the wrong pool to a
             panel would make them overlap. */
          var names = function (section) {
            return Array.prototype.map.call(
              at('[data-section="' + section + '"] .flag > span'),
              function (n) { return n.textContent.trim(); });
          };
          var fpNames = names("future-past-victory");
          var apNames = names("abduction-protocols");
          log("every box is named",
            fpNames.length + apNames.length === 9 &&
            fpNames.concat(apNames).every(function (n) { return n.length > 0; }),
            fpNames.concat(apNames).join(" | "));
          log("and the two panels draw from different sets",
            fpNames.every(function (n) { return apNames.indexOf(n) === -1; }),
            fpNames.join() + " vs " + apNames.join());
          /* The grid draws on the same set as the victory display — one Future

          var gridNames = Array.prototype.map.call(
            at('[data-section="future-past-deck"] th[scope="row"]'),
            function (n) { return n.textContent.trim(); });
          log("and the grid reads the same set as the victory display",
            gridNames.length === fpNames.length &&
            gridNames.every(function (n) { return fpNames.indexOf(n) !== -1; }),
            gridNames.join());

          /* The rule itself, derived instead of written out: a name is tagged as
             English exactly when it is the SAME string in both languages. Read
             in German, then in English, then switched back — so this keeps
             checking the rule however many names get translated later, instead
             of decaying into a list somebody has to maintain. */
          var tagged = Array.prototype.map.call(
            at('[data-section="future-past-victory"] .flag > span > span'),
            function (n) { return n.getAttribute("lang") === "en"; });
          d.getElementById("btn-lang").click();
          var english = names("future-past-victory");
          d.getElementById("btn-lang").click();
          var german = names("future-past-victory");
          log("the language tag follows the name actually shown",
            german.length === english.length && german.length > 0 &&
            german.every(function (n, i) { return tagged[i] === (n === english[i]); }),
            german.join() + " / " + english.join() + " / " + tagged.join());

          /* Switching twice rebuilt the sheet twice, so everything below has to
             be looked up again. */
          var fp = at('[data-section="future-past-victory"] .sheet-check');
          /* Ticked out of pool order on purpose: a set comes back in the pool's
             order, and that is what makes normalize() a fixpoint. */
          tick(fp[4]);
          tick(fp[1]);

          /* The same card in two scenarios' columns — allowed, and the normal
             case: a card recorded after scenario 1 is shuffled back into the
             encounter deck at scenario 2's setup. Row 2 is the second card of
             the set, columns 1 and 2 its first two cells. */
          var rows = at('[data-section="future-past-deck"] tbody tr');
          var cells = rows[1].querySelectorAll(".sheet-check");
          tick(cells[0]);
          tick(cells[1]);
          log("the same card can stand in two columns at once",
            cells[0].checked && cells[1].checked);

          var ss = at('[data-section="side-schemes"] .sheet-check');
          tick(ss[0]);
          var jub = app.querySelector('[data-jubilee="s2InPlay"]');
          log("scenario 2 has only the one printed Jubilee box",
            !!jub && !app.querySelector('[data-jubilee="s2Removed"]'));
          tick(jub);
          var cap = at('[data-section="abduction-protocols"] .sheet-check');
          tick(cap[2]);
          addEntry(d, "mg-removed-allies", "Lockheed");

          w.dispatchEvent(new w.Event("pagehide"));
          setTimeout(function () {
            var st = JSON.parse(localStorage.getItem("mcclog:logs")).mg1.state;
            log("a set is stored in the pool's order, not the clicking order",
              st.futurePastVictory.length === 2 &&
              st.futurePastVictory[0] !== st.futurePastVictory[1],
              JSON.stringify(st.futurePastVictory));
            log("the grid is stored as four columns",
              st.futurePastDeck.length === 4, st.futurePastDeck.length);
            log("and the repeated card sits in both of them",
              st.futurePastDeck[0].length === 1 && st.futurePastDeck[1].length === 1 &&
              st.futurePastDeck[0][0] === st.futurePastDeck[1][0],
              JSON.stringify(st.futurePastDeck));
            log("the side scheme, the Jubilee box and the ally were stored",
              st.sideSchemes.length === 1 && st.jubilee.s2InPlay === true &&
              st.captiveAllies.length === 1,
              JSON.stringify([st.sideSchemes, st.jubilee.s2InPlay, st.captiveAllies]));
            log("and so was the free-text ally",
              st.removedAllies.length === 1 && st.removedAllies[0] === "Lockheed",
              JSON.stringify(st.removedAllies));
            finish();
          }, 500);
        });
      }

      /* The derived-state case: the role decides which five boxes are shown and
         nothing else, the count note says what it cannot enforce, and exactly
         one pair of boxes on this sheet locks. */
      function caseMgRole() {
        var seeded = mgLog();
        seeded.state.players = [
          { hero: "Colossus", hp: 9, role: "", upgrades: [] },
          { hero: "Shadowcat", hp: 6, role: "", upgrades: [] },
        ];
        /* Scenario 4 arrives contradicting itself, the way an import or a
           hand-edited file can. Scenario 3 is left clean for the lock itself. */
        seeded.state.jubilee = { s2InPlay: false, s3InPlay: false, s3Removed: false,
                                 s4InPlay: true, s4Removed: true };
        seed({ mg1: seeded }, "mg1");
        boot("", function (frame, w, d) {
          f0 = w;
          var roleSel = function (n) {
            return d.querySelector('.player-card[data-player="' + n + '"] .pool-select');
          };
          var boxes = function (n) {
            return d.querySelectorAll('.player-card[data-player="' + n + '"] ' +
              "[data-upgrades] .sheet-check");
          };
          var note = function (n) {
            return d.querySelector('.player-card[data-player="' + n + '"] ' +
              "[data-upgrades] .lock-note").textContent.trim();
          };
          var boxNames = function (n) {
            return Array.prototype.map.call(
              d.querySelectorAll('.player-card[data-player="' + n + '"] ' +
                "[data-upgrades] .flag > span"),
              function (s) { return s.textContent.trim(); }).join("|");
          };
          var setRole = function (n, value) {
            var sel = roleSel(n);
            sel.value = value;
            fire(sel, "change");
          };

          log("the role is a pool of the four printed roles",
            roleSel(1).options.length === 5, roleSel(1).options.length);
          log("with no role there are no boxes", boxes(1).length === 0);
          log("and the card says to pick one first", note(1).length > 0, note(1));

          setRole(1, "brawler");
          log("a role brings exactly five boxes", boxes(1).length === 5, boxes(1).length);
          var brawler = boxNames(1);
          log("all five are named and distinct",
            brawler.split("|").length === 5 &&
            brawler.split("|").every(function (s) { return s.length > 0; }) &&
            brawler.split("|").filter(function (s, i, a) { return a.indexOf(s) === i; })
              .length === 5, brawler);
          log("and the note is gone", note(1) === "", note(1));

          /* Each player must take a different role, so the taken one closes for
             the others while staying selectable in its own select. */
          var taken = function (sel) {
            return Array.prototype.filter.call(sel.options, function (o) {
              return o.value === "brawler";
            })[0].disabled;
          };
          log("a role taken closes for the other player", taken(roleSel(2)) === true);
          log("but stays selectable in its own select", taken(roleSel(1)) === false);

          /* Read off the screen rather than written out here: the labels are
             still to be translated, and the assertion should not move with them.
             Compared as joined strings, not as sets — Coup de Grace is in two
             roles, so two roles are allowed to share a name. */
          setRole(1, "commander");
          log("another role brings another five", boxes(1).length === 5, boxes(1).length);
          log("and they are not the same five", boxNames(1) !== brawler, boxNames(1));

          /* THE regression test. A mark made under one role has to survive being
             hidden by another and come back — a mis-clicked dropdown must not
             cost the record, and swapping two players' roles necessarily passes
             through a moment with no role at all. */
          setRole(1, "brawler");
          var marked = boxNames(1).split("|")[0];
          tick(boxes(1)[0]);
          log("a mark can be made under the role", boxes(1)[0].checked);
          setRole(1, "peacekeeper");
          log("the box is gone with the role", boxNames(1).indexOf(marked) === -1,
            boxNames(1));
          log("and the card admits the mark is still kept", note(1).length > 0, note(1));
          setRole(1, "brawler");
          log("switching back brings the mark with it", boxes(1)[0].checked);
          setRole(1, "");
          log("clearing the role leaves no boxes", boxes(1).length === 0);
          log("and still says the mark is kept", note(1).length > 0, note(1));
          setRole(1, "brawler");

          /* The count note. The campaign has granted one so far — scenario 1's —
             so three marks are more than it can have handed out and the card
             says so. Checking two side-scheme boxes raises it to three and the
             note goes away. It NEVER closes a box: the rule caps a number
             rather than naming a card, and a fresh sheet would otherwise arrive
             four fifths shut. */
          tick(boxes(1)[1]);
          tick(boxes(1)[2]);
          log("more marks than granted is said out loud", note(1).length > 0, note(1));
          var openAll = function (n) {
            return Array.prototype.every.call(boxes(n), function (b) { return !b.disabled; });
          };
          log("but no upgrade box is ever closed", openAll(1) === true);
          var ss = d.querySelectorAll('[data-section="side-schemes"] .sheet-check');
          tick(ss[0]);
          tick(ss[1]);
          log("granting more clears the note", note(1) === "", note(1));
          log("and still nothing is closed", openAll(1) === true);

          /* Jubilee, the one pair that does lock: two states of one outcome,
             printed side by side under one scenario. */
          var jb = function (key) { return d.querySelector('[data-jubilee="' + key + '"]'); };
          log("a clean scenario has both boxes open",
            !jb("s3InPlay").disabled && !jb("s3Removed").disabled);
          tick(jb("s3InPlay"));
          log("in play closes removed", jb("s3Removed").disabled === true);
          log("and does not close itself", jb("s3InPlay").disabled === false);
          jb("s3InPlay").checked = false;
          fire(jb("s3InPlay"), "change");
          log("clearing it opens the other again", jb("s3Removed").disabled === false);
          /* One-sided on purpose: a sheet that arrives with both set would
             otherwise be frozen solid with no way out. */
          log("a scenario that arrives contradicting itself stays operable",
            jb("s4InPlay").checked && jb("s4Removed").checked &&
            !jb("s4InPlay").disabled && !jb("s4Removed").disabled);

          /* Across scenarios it is only said, never enforced: the sheet prints
             no arrow between the columns, and a group may well correct the
             earlier one after filling in the later. */
          var cellNote = function (key) {
            return jb(key).closest(".cell").querySelector(".lock-note").textContent.trim();
          };
          tick(jb("s3Removed"));
          log("removed earlier and in play later is marked",
            cellNote("s4InPlay").length > 0, cellNote("s4InPlay"));
          log("and neither of those boxes is closed by it",
            !jb("s4InPlay").disabled && !jb("s3Removed").disabled);

          w.dispatchEvent(new w.Event("pagehide"));
          setTimeout(function () {
            var st = JSON.parse(localStorage.getItem("mcclog:logs")).mg1.state;
            log("the role is stored", st.players[0].role === "brawler",
              st.players[0].role);
            log("and the three marks with it", st.players[0].upgrades.length === 3,
              JSON.stringify(st.players[0].upgrades));
            log("the second player kept no role", st.players[1].role === "",
              st.players[1].role);
            finish();
          }, 500);
        });
      }

      function caseMgExpert() {
        var seeded = mgLog();
        seeded.state.expert = false;
        /* Filled in, but not visible at standard level — exactly the state that
           would lose data if hiding were clearing. */
        seeded.state.players = [{ hero: "Colossus", hp: 6, role: "brawler",
                                  upgrades: ["brawler-war-cry"] }];
        seed({ mg1: seeded }, "mg1");
        boot("", function (frame, w, d) {
          f0 = w;
          var card = function () { return d.querySelector(".player-card"); };
          var toggle = function () {
            return d.querySelector("[data-section=players] .panel-head .flag .sheet-check");
          };

          log("the switch is in the player panel head", !!toggle());
          log("it starts unticked", toggle().checked === false);
          log("standard hides the hit points", !card().querySelector(".num-input"));
          log("the identity field is not hidden with them",
            !!card().querySelector(".text-input"));
          /* The level governs the hit points and nothing else on this sheet: the
             sheet prints "(expert)" under those and nowhere else. */
          log("standard leaves the role", !!card().querySelector(".pool-select"));
          log("and leaves its five boxes",
            card().querySelectorAll("[data-upgrades] .sheet-check").length === 5,
            card().querySelectorAll("[data-upgrades] .sheet-check").length);
          log("and every printed section is still there",
            d.querySelectorAll("[data-section]").length === MG_SECTIONS.length,
            d.querySelectorAll("[data-section]").length);

          toggle().checked = true;
          fire(toggle(), "change");
          log("expert reveals the hit points", !!card().querySelector(".num-input"));
          log("and the value was still there",
            card().querySelector(".num-input").value === "6",
            card().querySelector(".num-input").value);

          toggle().checked = false;
          fire(toggle(), "change");
          log("switching back hides them again", !card().querySelector(".num-input"));

          w.dispatchEvent(new w.Event("pagehide"));
          setTimeout(function () {
            var st = JSON.parse(localStorage.getItem("mcclog:logs")).mg1.state;
            log("the sheet is back at standard", st.expert === false);
            log("but the hidden hit points survived", st.players[0].hp === 6,
              st.players[0].hp);
            finish();
          }, 500);
        });
      }

      function caseMgPrint() {
        var seeded = mgLog();
        seeded.state.players = [
          { hero: "Colossus", hp: 9, role: "brawler",
            upgrades: ["brawler-coup-de-grace", "brawler-war-cry"] },
          /* Peacekeeper now, Defender before: the printout has to carry what is
             stored under the role that is no longer held. One own mark against
             three granted, so the count note stays out of the way and the card's
             note is the orphan one and nothing else. */
          { hero: "Shadowcat", hp: 6, role: "peacekeeper",
            upgrades: ["defender-bodyguard", "peacekeeper-mentorship"] },
        ];
        seeded.state.sideSchemes = ["frightened-police", "find-the-prisoners"];
        seeded.state.futurePastVictory = ["nimrod"];
        /* One column deliberately empty: it has to print anyway. */
        seeded.state.futurePastDeck = [["bastion"], ["bastion"], [], ["nimrods-portal"]];
        seeded.state.jubilee = { s2InPlay: true, s3InPlay: false, s3Removed: true,
                                 s4InPlay: false, s4Removed: false };
        seeded.state.captiveAllies = ["rictor"];
        seeded.state.removedAllies = ["Lockheed", "~Nightcrawler"];
        seed({ mg1: seeded }, "mg1");
        boot("", function (frame, w, d) {
          f0 = w;
          w.dispatchEvent(new w.Event("beforeprint"));
          var pv = d.getElementById("print-view");
          var text = pv.textContent;
          var app = d.getElementById("campaign");
          log("print view built", pv.children.length > 0, pv.children.length);
          log("print names the campaign", /Mutant Genesis \(MC32\)/.test(text));
          log("print says which level was played",
            /\[x\] Expertenmodus/.test(text), text.slice(0, 120));
          /* Named, not just the bare number: textContent runs the lines
             together, so a digit on its own proves nothing about where it sat. */
          log("print carries the hit points",
            /Lebenspunkte: 9/.test(text) && /Lebenspunkte: 6/.test(text));

          /* Names come off the sheet rather than out of this file: they are
             still to be translated, and the printout has to carry whatever is
             shown. */
          var shown = function (sel) {
            var s2 = app.querySelector(sel);
            return s2.options[s2.selectedIndex].textContent.trim();
          };
          var role1 = shown('.player-card[data-player="1"] .pool-select');
          var role2 = shown('.player-card[data-player="2"] .pool-select');
          log("print carries each player's role",
            text.indexOf(role1) !== -1 && text.indexOf(role2) !== -1,
            role1 + " / " + role2);

          var upNames = function (n) {
            return Array.prototype.map.call(
              app.querySelectorAll('.player-card[data-player="' + n + '"] ' +
                "[data-upgrades] .flag > span"),
              function (s) { return s.textContent.trim(); });
          };
          log("and all five boxes of the role that is held, set or not",
            upNames(1).length === 5 &&
            upNames(1).every(function (name) { return text.indexOf(name) !== -1; }),
            upNames(1).join());

          /* A mark under a role the player no longer holds is not on screen as a
             box, and the printout must not swallow it. Read through the card's
             own note, which is the only thing on screen that says it is there. */
          var orphanNote = app.querySelector('.player-card[data-player="2"] ' +
            "[data-upgrades] .lock-note").textContent.trim();
          log("and the marks kept under another role",
            orphanNote.length > 0 && text.indexOf(orphanNote) !== -1, orphanNote);

          /* The section headings are read off the screen too, so a section can
             be found in the printout without this file knowing its words. */
          var heading = function (id) {
            return app.querySelector('[data-section="' + id + '"] h2').textContent.trim();
          };
          var printed = function (id) {
            var want = heading(id);
            var out = null;
            Array.prototype.forEach.call(pv.querySelectorAll(".print-section"), function (s) {
              if (s.querySelector("h2").textContent.trim() === want) out = s;
            });
            return out;
          };
          /* Whole sets, set or not: which side schemes were NOT defeated decides
             how many upgrades the next scenario grants. */
          var ssLines = printed("side-schemes").querySelectorAll(".print-line");
          log("every side-scheme box prints, set or not", ssLines.length === 4,
            ssLines.length);
          log("and matches what the boxes on screen say",
            Array.prototype.filter.call(ssLines, function (l) {
              return l.textContent.indexOf("[x]") === 0;
            }).length ===
            Array.prototype.filter.call(
              app.querySelectorAll('[data-section="side-schemes"] .sheet-check'),
              function (b) { return b.checked; }).length);

          /* Four scenario blocks of five cards each, the empty column included:
             an empty column says that scenario carried nothing forward, and the
             sheet leaves the place visible either way. */
          var deckLines = printed("future-past-deck").querySelectorAll(".print-line");
          log("the whole grid prints, empty columns included",
            deckLines.length === 4 + 4 * 5, deckLines.length);
          /* And each block says which scenario it is, in the same words the
             grid's own column headers carry on screen. */
          var colLabels = Array.prototype.map.call(
            app.querySelectorAll('[data-section="future-past-deck"] th[scope="col"]'),
            function (th) { return th.textContent.trim(); }).slice(1);
          log("and each block says which scenario it is",
            colLabels.length === 4 && colLabels.every(function (l) {
              return printed("future-past-deck").textContent.indexOf(l) !== -1;
            }), colLabels.join());
          /* Three scenario blocks, one box for scenario 2 and two each for 3
             and 4 — exactly what the sheet prints. */
          var jubLines = printed("jubilee").querySelectorAll(".print-line");
          log("Jubilee prints the boxes the sheet has", jubLines.length === 3 + 5,
            jubLines.length);

          var fpLines = printed("future-past-victory").querySelectorAll(".print-line");
          var apLines = printed("abduction-protocols").querySelectorAll(".print-line");
          log("both card sets print whole", fpLines.length === 5 && apLines.length === 4,
            fpLines.length + "/" + apLines.length);

          /* The free-text list keeps its own shape, and a "~" entry prints
             struck rather than with the marker showing. */
          var items = printed("removed-allies").querySelectorAll(".print-list li");
          log("the free-text allies print as a list", items.length === 2, items.length);
          log("and a struck one prints struck",
            items[1].className === "struck" &&
            items[1].textContent.indexOf("~") === -1,
            items[1].className + " / " + items[1].textContent);

          /* Never printed: that a box is closed, and the wording of any rule. */
          log("the printout does not say what the screen closed",
            text.indexOf("[") !== -1 &&
            text.indexOf(app.querySelector('[data-jubilee="s3InPlay"]').title) === -1,
            app.querySelector('[data-jubilee="s3InPlay"]').title);
          finish();
        });
      }

      var cases = { round: caseRound, roundlast: caseRoundLast, roundspread: caseRoundSpread, players: casePlayers, migrate: caseMigrate, random: caseRandom, randomspread: caseRandomSpread, appearance: caseAppearance, basic: caseBasic, quarantine: caseQuarantine, share: caseShare, lang: caseLang, langpath: caseLangPath, print: casePrint, "import": caseImport, lock: caseLock, lockconflict: caseLockConflict, rrs: caseRrs, rrsdialog: caseRrsDialog, rrsprint: caseRrsPrint, rrspools: caseRrsPools, rrsexpert: caseRrsExpert, expert: caseExpert, mts: caseMts, mtsexpert: caseMtsExpert, mtsprint: caseMtsPrint, sm: caseSm, smrep: caseSmRep, smexpert: caseSmExpert, smprint: caseSmPrint, mg: caseMg, mgrole: caseMgRole, mgexpert: caseMgExpert, mgprint: caseMgPrint };
      (cases[CASE] || caseBasic)();
    </script>
  </body>
</html>
