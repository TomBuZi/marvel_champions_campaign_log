<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>seed</title></head><body>
<script>
/* Legt einen ausgefüllten Beispielbogen an und springt in die App — für
   Screenshots und den Druckvergleich. "?c=mc10" nimmt den MC10-Bogen, ohne
   Angabe kommt MC60. */
var q = new URLSearchParams(location.search);
var which = q.get("c") === "mc10" ? "mc10" : "mc60";
/* "?theme=dark" (oder light) nagelt das Theme fest — sonst folgt es dem System.
   Gebraucht fuer den Druckvergleich: der Druck muss schwarz auf weiss sein,
   auch aus einer Dark-Mode-Sitzung und auch mit einem Kampagnen-Skin. */
var theme = q.get("theme");
/* "?expert=0" stellt den MC10-Bogen auf Standardstufe, wo verbleibende
   Trefferpunkte und Verpflichtungen ausgeblendet sind. */
var expert = q.get("expert");

var logs = {
  mc60: {
    schemaVersion: 1, id: "seed-1", campaignId: "fear-no-evil", stateVersion: 2,
    title: "Höllenküche, Runde 1", createdAt: "2026-08-01T18:00:00.000Z",
    updatedAt: "2026-08-14T21:30:00.000Z",
    state: {
      players: [
        { hero: "Daredevil", hp: 8 }, { hero: "Echo", hp: 11 },
        { hero: "Spider-Man * Peter Parker", hp: 4 }
      ],
      scenarios: [
        { slug: "art-museum-heist",  completed: true,  villain: "hammerhead",   progress: 1 },
        { slug: "the-getaway",       completed: false, villain: "bullseye",     progress: 3 },
        { slug: "protection-racket", completed: true,  villain: "purple-man",   progress: 2 },
        { slug: "the-raft-breakout", completed: false, villain: "electro",      progress: 0 },
        { slug: "stop-the-presses",  completed: false, villain: "typhoid-mary", progress: 1 }
      ],
      removed: ["~Foggy Nelson", "Karen Page", "Ben Urich"],
      flags: { trustEstablished: true, maryDefeated: false }
    }
  },
  mc10: {
    schemaVersion: 1, id: "seed-2", campaignId: "rise-of-red-skull", stateVersion: 1,
    title: "Roter Schädel, Durchgang 1", createdAt: "2026-08-02T18:00:00.000Z",
    updatedAt: "2026-08-15T20:10:00.000Z",
    state: {
      expert: true,
      players: [
        { hero: "Captain America", hp: 9,
          obligations: ["martial-law", "anti-hero-propaganda"],
          techUpgrade: "laser-cannon", basicUpgrade: "basic-attack",
          rescuedAllies: ["elektra", "white-tiger"], engagedWithMinion: true },
        { hero: "Black Widow", hp: 11,
          obligations: ["martial-law"],
          techUpgrade: "tactical-scanner", basicUpgrade: "basic-thwart",
          rescuedAllies: ["shang-chi"], engagedWithMinion: false },
        { hero: "Ms. Marvel", hp: 7,
          obligations: [],
          techUpgrade: "", basicUpgrade: "basic-recovery",
          rescuedAllies: [], engagedWithMinion: true }
      ],
      experimentalWeapons: ["laser-rifle", "exo-suit"],
      delayCounters: 3,
      removed: ["~Nick Fury", "Maria Hill"]
    }
  }
};

var log = logs[which];
if (expert === "0" && log.state.expert !== undefined) log.state.expert = false;
localStorage.clear();
var store = {};
store[log.id] = log;
localStorage.setItem("mcclog:logs", JSON.stringify(store));
localStorage.setItem("mcclog:activeId", log.id);
localStorage.setItem("mcclog:lang", "de");
if (theme === "dark" || theme === "light") localStorage.setItem("mcclog:theme", theme);
location.replace("../index.html");
</script></body></html>
