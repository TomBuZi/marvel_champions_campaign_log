<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marvel Champions – Kampagnen-Logbuch</title>
    <meta
      name="description"
      content="Kampagnen-Logbuch für Marvel Champions: The Card Game. Läuft komplett im Browser, inoffizielles Fan-Projekt." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1><span data-i18n="appTitle">Kampagnen-Logbuch</span><span class="badge-unofficial" data-i18n="unofficial">inoffiziell</span></h1>
        <!-- Names the active log's campaign, so it is written by core.js
             rather than bound to a fixed key. -->
        <p class="subtitle" id="subtitle">Marvel Champions</p>
      </div>

      <div class="controls">
        <label class="log-picker">
          <span class="sr-only" data-i18n="logLabel">Bogen</span>
          <select id="log-select" data-i18n-aria="logLabel"></select>
        </label>
        <!-- The one action that is not administration, so the one action that
             is not in the menu: sharing the sheet is what people reach for
             mid-game, and it belongs one tap away rather than two. It stays a
             single control — there is deliberately no second "Link teilen" in
             the menu. -->
        <button
          id="btn-share"
          type="button"
          class="btn btn-icon"
          data-i18n-title="shareLink"
          data-i18n-aria="shareLink">
          <!-- The classic share mark: three dots joined by two lines. Drawn
               here rather than taken from an icon set, because the figure IS
               its geometry — circles of r=3 at (18,5), (6,12) and (18,19) on
               the usual 24 grid, and two 2-wide bars between their edges — so
               a licensed copy would add an attribution obligation and a
               third-party asset for four lines of arithmetic. SVG rather than
               CSS, unlike the other devices in this project: gradients give
               soft dots and an approximated angle, and an icon has to be crisp
               at any size. Decoration only — the button's own label names the
               action. -->
          <svg class="icon-share" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M8.59 10.49 15.41 6.51M8.59 13.51 15.41 17.49" />
            <circle cx="18" cy="5" r="3" />
            <circle cx="6" cy="12" r="3" />
            <circle cx="18" cy="19" r="3" />
          </svg>
        </button>
        <button
          id="btn-menu"
          type="button"
          class="btn btn-icon"
          popovertarget="main-menu"
          aria-haspopup="true"
          aria-expanded="false"
          data-i18n-title="menu"
          data-i18n-aria="menu">
          ☰
        </button>
      </div>
    </header>

    <!-- Every administrative action lives here — sharing is the exception and
         sits in the bar above. Deliberately not role="menu": that would imply
         arrow-key navigation; as a group of buttons, Tab works correctly.
         Native popover gives light-dismiss, Esc and top-layer stacking. -->
    <div id="main-menu" popover class="menu" data-i18n-aria="menu">
      <p class="menu-heading" data-i18n="menuLog">Bogen</p>
      <button id="btn-new" type="button" class="menu-item" data-i18n="newLog">Neuer Bogen …</button>
      <button id="btn-rename" type="button" class="menu-item" data-i18n="renameLog">Umbenennen …</button>
      <button id="btn-delete" type="button" class="menu-item danger" data-i18n="deleteLog">Löschen …</button>

      <hr class="menu-sep" />

      <p class="menu-heading" data-i18n="menuData">Daten</p>
      <button id="btn-export" type="button" class="menu-item" data-i18n="export">Exportieren (.json)</button>
      <button id="btn-import" type="button" class="menu-item" data-i18n="import">Importieren …</button>
      <button
        id="btn-print"
        type="button"
        class="menu-item"
        data-i18n="print"
        data-i18n-title="printTitle">
        Drucken
      </button>

      <hr class="menu-sep" />

      <p class="menu-heading" data-i18n="menuView">Ansicht</p>
      <!-- Label and badge of these two rows are filled by core.js, since both
           depend on the current language / theme rather than a fixed key. -->
      <button id="btn-lang" type="button" class="menu-item"></button>
      <button id="btn-theme" type="button" class="menu-item"></button>

      <hr class="menu-sep" />

      <button id="btn-help" type="button" class="menu-item" data-i18n="helpTitle">Hilfe</button>
    </div>

    <input id="file-import" type="file" accept="application/json,.json" hidden />

    <main id="app">
      <!-- Shown instead of the sheet when the selected log cannot be
           represented by this build; filled by core.js. -->
      <p id="notice" class="notice" role="status" hidden></p>

      <!-- Owned entirely by the active campaign module. Nothing about a
           specific campaign appears in this file. -->
      <div id="campaign"></div>
    </main>

    <!-- Static snapshot of the active log, built on demand and shown only when
         printing (the interactive view above is hidden then). -->
    <div id="print-view" class="print-only" aria-hidden="true"></div>

    <!-- Asked when a new log is created, because a log's campaign is fixed from
         then on. Skipped while only one campaign is registered. -->
    <dialog id="campaign-dialog" class="dialog" aria-labelledby="campaign-dialog-title">
      <form id="campaign-form" method="dialog">
        <h2 id="campaign-dialog-title" data-i18n="chooseCampaignTitle">Neuer Bogen</h2>
        <p class="hint" data-i18n="chooseCampaignHint"></p>
        <fieldset>
          <legend data-i18n="chooseCampaignLabel">Kampagne</legend>
          <div id="campaign-choices"></div>
        </fieldset>
        <!-- The caption sits in its own <span>: applyLanguage() writes
             textContent, so a data-i18n on the <label> itself would delete the
             input inside it. Same reason the title in the topbar is wrapped. -->
        <label class="field-label">
          <span data-i18n="logTitleLabel">Name des Bogens</span>
          <input id="new-log-title" type="text" maxlength="80" />
        </label>
        <div class="dialog-actions">
          <button id="btn-campaign-cancel" type="button" class="btn" data-i18n="cancel">Abbrechen</button>
          <button type="submit" class="btn btn-primary" data-i18n="create">Anlegen</button>
        </div>
      </form>
    </dialog>

    <dialog id="help-dialog" class="help-dialog" aria-labelledby="help-title">
      <div class="help-head">
        <h2 id="help-title" data-i18n="helpHeading">Hilfe – Bedienung</h2>
        <button
          id="btn-help-close"
          type="button"
          class="help-close"
          data-i18n-title="close"
          data-i18n-aria="close">
          ×
        </button>
      </div>
      <div class="help-body">
        <p class="help-intro" data-i18n="helpIntro"></p>
        <!-- The active campaign's own explanation, appended by core.js. -->
        <section id="help-campaign"></section>
        <section>
          <h3 data-i18n="helpStoreH"></h3>
          <p data-i18n="helpStoreP"></p>
        </section>
        <section>
          <h3 data-i18n="helpLogsH"></h3>
          <p data-i18n="helpLogsP"></p>
        </section>
        <section>
          <h3 data-i18n="helpSheetH"></h3>
          <p data-i18n="helpSheetP"></p>
        </section>
        <section>
          <h3 data-i18n="helpListsH"></h3>
          <p data-i18n="helpListsP"></p>
        </section>
        <section>
          <h3 data-i18n="helpStrikeH"></h3>
          <p data-i18n="helpStrikeP"></p>
        </section>
        <section>
          <h3 data-i18n="helpShareH"></h3>
          <p data-i18n="helpShareP"></p>
        </section>
        <section>
          <h3 data-i18n="helpPrintH"></h3>
          <p data-i18n="helpPrintP"></p>
        </section>
        <section>
          <h3 data-i18n="helpLangThemeH"></h3>
          <p data-i18n="helpLangThemeP"></p>
        </section>
        <section>
          <h3 data-i18n="helpLegalH"></h3>
          <p data-i18n="helpLegalP"></p>
        </section>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <footer class="footer">
      <div><span data-i18n="savedNotice">Automatisch gespeichert</span></div>
      <p class="footer-links">
        <span data-i18n="contactLead">Fehler gefunden oder ein Wunsch?</span>
        <a class="chip-link" href="mailto:Tom@marvelchampionspodcast.de" data-i18n-title="contactTitle">
          <span class="chip-icon" aria-hidden="true">✉️</span>Tom@marvelchampionspodcast.de
        </a>
        <a
          class="chip-link chip-thanks"
          href="https://ko-fi.com/mc_campaign_logs"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n-title="thanksTitle">
          <span class="chip-icon" aria-hidden="true">☕</span><span data-i18n="thanks">Danke sagen</span><span class="chip-icon" aria-hidden="true">❤️</span>
        </a>
      </p>
      <p class="disclaimer" data-i18n="disclaimer"></p>
    </footer>

    <script src="i18n.js"></script>
    <script src="widgets.js"></script>
    <script src="heroes.js"></script>
    <!-- core.js before the campaigns: it defines registerCampaign(), which each
         campaign calls while loading. Its own boot waits for DOMContentLoaded,
         so every campaign is registered by the time anything renders. -->
    <script src="core.js"></script>
    <!-- One script per campaign. The order here is only the registration order;
         WHERE a campaign appears in the log picker and in the new-log dialog is
         decided by campaignsByCode() in core.js, which sorts by MC number. -->
    <script src="campaigns/fear-no-evil.js"></script>
    <script src="campaigns/rise-of-red-skull.js"></script>
    <script src="campaigns/galaxys-most-wanted.js"></script>
    <script src="campaigns/mad-titans-shadow.js"></script>
    <script src="campaigns/sinister-motives.js"></script>
    <script src="campaigns/mutant-genesis.js"></script>
    <script src="campaigns/next-evolution.js"></script>
    <script src="campaigns/age-of-apocalypse.js"></script>
  </body>
</html>
